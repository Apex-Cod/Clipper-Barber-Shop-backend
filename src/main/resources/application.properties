spring.application.name=clipperBarberShop
spring.datasource.url=jdbc:postgresql://localhost:5434/clipperdb
spring.datasource.username=clipper
spring.datasource.password=clipper123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
# update: Actualiza el esquema automáticamente al iniciar
# validate: Solo valida el esquema, no hace cambios
# create: Elimina y recrea el esquema (¡CUIDADO en producción!)
# create-drop: Crea al iniciar y elimina al cerrar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar los cambios de DDL que Hibernate va a hacer
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.security.user.name=admin
spring.security.user.password=664c39fb-a87b-4145-8b8d-9fe5fb536cc6
spring.security.user.roles=ADMIN,USER

app.jwt.secret=miClaveSecretaSegura
app.jwt.expiration-ms=86400000

# Configuración de logging para debugging
logging.level.apex.code.clipperBarberShop.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
