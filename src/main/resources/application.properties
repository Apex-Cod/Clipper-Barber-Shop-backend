spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
# update: Actualiza el esquema automáticamente al iniciar
# validate: Solo valida el esquema, no hace cambios
# create: Elimina y recrea el esquema (¡CUIDADO en producción!)
# create-drop: Crea al iniciar y elimina al cerrar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar los cambios de DDL que Hibernate va a hacer
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

