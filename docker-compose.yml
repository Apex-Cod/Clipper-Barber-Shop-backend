version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: clipper_postgres
    restart: always
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper123
      POSTGRES_DB: clipperdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
